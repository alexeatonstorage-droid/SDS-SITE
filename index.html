<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDS Visual Test Site</title>
<style>
:root{--bg:#07111f;--card:#101c2d;--line:#203047;--cyan:#67e8f9;--muted:#94a3b8;--amber:#fcd34d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#06101d,#0b1628 55%,#081321);color:#fff}header,main,footer{max-width:1100px;margin:auto;padding:28px 20px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#183047;color:var(--cyan);font-weight:700;font-size:12px}h1{font-size:clamp(34px,7vw,64px);margin:18px 0 8px;line-height:1}.cyan{color:var(--cyan)}p{color:#cbd5e1;line-height:1.6}.search{margin-top:26px;width:100%;padding:16px;border:1px solid var(--line);border-radius:16px;background:#101c2d;color:white;font-size:16px;outline:none}.search:focus{border-color:var(--cyan)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#3b7281}.stripe{height:6px;border-radius:20px;margin:-22px -22px 20px}.red{background:linear-gradient(90deg,#ef4444,#f59e0b)}.blue{background:linear-gradient(90deg,#0ea5e9,#22d3ee)}.cas,.cat{color:var(--muted);font-size:14px}.signal{color:var(--amber);font-weight:700}.notice{margin-top:26px;padding:18px;border:1px solid #765f24;background:#3a2d0d55;border-radius:18px;color:#fde68a}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.box{max-width:700px;width:100%;max-height:88vh;overflow:auto;background:#0f1b2d;border:1px solid var(--line);border-radius:24px;padding:26px}.close{float:right;background:#223047;color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.section{background:#ffffff0c;border-radius:16px;padding:16px;margin-top:15px}.pdf{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#334155;color:#94a3b8;font-weight:700}footer{text-align:center;color:#64748b;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}header{padding-top:40px}}
</style>
</head><body>
<header><span class="badge">PUBLIC SAFETY DEMO · 無公司資料</span><h1>Safety Data Sheet <span class="cyan">Finder</span></h1><p>行動優先的 SDS 視覺化測試網站。以下皆為示範資料，不代表任何公司、地點或實際作業場所。</p><input id="q" class="search" placeholder="搜尋化學品 / 中文名稱 / CAS No."></header>
<main><h2>SDS 快速查詢</h2><div id="grid" class="grid"></div><div class="notice"><b>測試提醒：</b>本頁危害資訊僅用於展示介面。正式部署時，應使用實際產品最新版供應商 SDS，並建立版本及更新日期管制。</div></main>
<footer>SDS Visual Prototype · Demonstration content only · No company information</footer>
<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="close" onclick="closeM()">關閉</button><div id="detail"></div></div></div>
<script>
const data=[
{name:'Acetone',zh:'丙酮',cas:'67-64-1',cat:'Solvent / 溶劑',signal:'Danger / 危險',stripe:'red',haz:['高度易燃液體及蒸氣','造成嚴重眼睛刺激','可能造成困倦或暈眩'],aid:'吸入後移至空氣新鮮處。眼睛接觸時，以清水小心沖洗數分鐘。'},
{name:'Isopropyl Alcohol',zh:'異丙醇',cas:'67-63-0',cat:'Cleaner / 清潔劑',signal:'Danger / 危險',stripe:'red',haz:['高度易燃液體及蒸氣','造成嚴重眼睛刺激','可能造成困倦或暈眩'],aid:'吸入後移至空氣新鮮處。眼睛接觸時以清水沖洗。'},
{name:'Hydrogen Peroxide',zh:'過氧化氫',cas:'7722-84-1',cat:'Oxidizer / 氧化劑',signal:'Demo / 示範',stripe:'blue',haz:['危害分類會因濃度而有明顯差異','使用前應查閱實際產品供應商 SDS'],aid:'依實際濃度之供應商 SDS 採取急救措施。'}];
function render(){let q=document.getElementById('q').value.toLowerCase();let a=data.filter(x=>(x.name+x.zh+x.cas+x.cat).toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.map((x,i)=>`<article class="card" onclick="openM(${data.indexOf(x)})"><div class="stripe ${x.stripe}"></div><h3>${x.name} / ${x.zh}</h3><div class="cas">CAS ${x.cas}</div><p class="cat">${x.cat}</p><div class="signal">${x.signal}</div></article>`).join('')||'<p>查無結果</p>'}
function openM(i){let x=data[i];document.getElementById('detail').innerHTML=`<div class="badge">SAFETY DATA SHEET · DEMO</div><h2>${x.name} / ${x.zh}</h2><p>CAS ${x.cas} · ${x.cat}</p><div class="section"><b>危害資訊</b><ul>${x.haz.map(h=>`<li>${h}</li>`).join('')}</ul></div><div class="section"><b>急救</b><p>${x.aid}</p></div><div class="notice">此為介面示範資料。正式使用請連結最新版供應商 SDS。</div><button disabled class="pdf">Supplier SDS PDF · 正式部署時連結</button>`;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}document.getElementById('q').addEventListener('input',render);render();
</script></body></html>
